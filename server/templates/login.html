<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/static/styles.css">
<title>Kids Control</title>
</head>
<body class="login-body">
  <main class="login-card glass">
    <div class="brand-row"><span class="brand-mark">✓</span><div><b>Kids Control</b><small>Parent command centre</small></div></div>
    <h1>Control without the chaos.</h1>
    <p class="muted">One place for app shields, lockdowns and your kids' devices.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Username</label><input name="username" autocomplete="username" required>
      <label>Password</label><input name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Open dashboard</button>
    </form>
  </main>
</body>
</html>
