name: KidsControl
options:
  bundleIdPrefix: com.kidscontrol
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  KidsControl:
    type: application
    platform: iOS
    sources:
      - KidsControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidscontrol.hub
        INFOPLIST_FILE: KidsControl/Info.plist
        CODE_SIGN_ENTITLEMENTS: KidsControl/KidsControl.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: KidsControl/KidsControl.entitlements
